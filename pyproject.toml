[project]
name = "ppe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "davidmba819", email = "davidmba816@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "opencv-python-headless>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "streamlit>=1.67.0",
    "ultralytics>=8.4.216",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.scripts]
ppe = "ppe:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true